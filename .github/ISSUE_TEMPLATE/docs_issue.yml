name: Docs issue ("the docs lie")
description: Documentation is wrong, missing, or doesn't match how the framework actually behaves.
labels: [docs]
body:
  - type: input
    id: where
    attributes:
      label: Which doc
      description: Page or path (e.g. docs/basics/quickstart.md, README).
    validations:
      required: true
  - type: textarea
    id: mismatch
    attributes:
      label: What the docs say vs. what actually happens
      description: Quote the doc and describe the real behavior.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested correction (optional)
