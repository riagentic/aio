name: CI

# Correctness only: format, lint, type check and the test suite on every push
# and pull request. aio is consumed as source, so nothing is built, packaged or
# published here. The full release gate list (bundle size, benchmarks,
# mutations, build/Electron/onboard e2e, the lab) stays local:
# `deno task check:release` before a tag.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # journal-sync-listener-crash reads the real v1.0.9-beta tag
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        # nodeModulesDir: tests that bundle with esbuild or build a probe app
        # resolve npm packages (immer) through a node_modules folder.
        run: deno install --node-modules-dir=auto
      - name: Format check
        run: deno fmt --check
      - name: Lint
        run: deno task lint
      - name: aiol (the project's own linter)
        run: deno task lint:aio
      - name: Type check (full tree)
        run: deno task check
      - name: Test environment
        # A display for the window tests (Electron stand-ins refuse to open a
        # window with no DISPLAY), and a local `main` branch: a PR checkout is
        # a detached merge commit, and the version-pin tests resolve `main`.
        run: |
          command -v Xvfb >/dev/null || sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1920x1200x24 >/dev/null 2>&1 &
          git branch main origin/main 2>/dev/null || true
      - name: Test
        # The shard runner keeps 4 cores free by default (for a dev machine)
        # and picks usable/2 shards: on a 4-core runner that is ONE shard, and
        # all ~2,900 files ran in series past the job timeout (it was slow,
        # not hung: the runner's 5-minute no-output watch never fired). CI has
        # nothing else to protect: keep one core for the OS, and run 4 shards,
        # since most test time is spent waiting on child processes.
        env:
          AIO_TEST_FREE_CORES: "1"
          AIO_TEST_SHARDS: "4"
          DISPLAY: ":99"
          AIO_TEST_DISPLAY: ":99"
          # The runner is itself a systemd service and hands its INVOCATION_ID
          # to every step: aio reads that as "under a service manager" and the
          # apps the tests start take the service-unit exit paths (143, no
          # in-place update handover). Tests model a shell: empty is unset.
          INVOCATION_ID: ""
        run: deno task test
      - name: Upload shard logs
        # Each shard's full output, so a red or slow run can be read file by
        # file (the runner only prints a summary).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-shard-logs
          path: .aio/test-shards/
          if-no-files-found: ignore
          retention-days: 7
