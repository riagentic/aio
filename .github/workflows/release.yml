name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write # needed for JSR publish

jobs:
  check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"
      - name: Format check
        run: deno fmt --check
      - name: Type check
        run: deno check mod.ts
      - name: Lint
        run: deno lint src/
      - name: AIO Lint
        run: deno task lint:aio

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"
      - name: Run tests with coverage
        run: deno task test --coverage=cov/
      - name: Generate coverage report
        run: deno coverage cov/
      - name: Coverage summary (lcov)
        run: deno coverage cov/ --lcov --output=cov/lcov.info

  publish:
    name: Publish to JSR
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"
      - name: Publish to JSR
        run: deno publish
