<svg width="560" height="160" viewBox="0 0 560 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="aio — all-in-one app framework">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c2d6"/>
      <stop offset="1" stop-color="#5b6cff"/>
    </linearGradient>
  </defs>

  <!-- mark: three layers (state · persistence · ui) converging into one node -->
  <rect x="16" y="24" width="112" height="112" rx="26" fill="url(#g)"/>
  <g stroke="#ffffff" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M42 60 H78"/>
    <path d="M42 80 H90"/>
    <path d="M42 100 H78"/>
  </g>
  <circle cx="100" cy="80" r="13" fill="#ffffff"/>

  <!-- wordmark -->
  <text x="156" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="72" font-weight="800" letter-spacing="-2" fill="url(#g)">aio</text>

  <!-- tagline -->
  <text x="160" y="122" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="17" font-weight="500" letter-spacing="0.5" fill="#8a94a6">all-in-one · batteries included</text>
</svg>
