# The Windows SFX stub. Built only when this source changes — the command, the
# pinned toolchain and the pins to update are in README.md.
[package]
name = "aio-windows-sfx-stub"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ruzstd = { version = "0.8", default-features = false, features = ["std"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
